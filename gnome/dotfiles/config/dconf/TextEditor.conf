[org/gnome/TextEditor]
custom-font='CaskaydiaCove Nerd Font 11'
highlight-current-line=true
indent-style='space'
keybindings='vim'
right-margin-position=uint32 86
show-line-numbers=true
show-map=true
show-right-margin=false
style-scheme='builder'
style-variant='light'
tab-width=uint32 4
use-system-font=false
wrap-text=true
